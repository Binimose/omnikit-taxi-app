name: omnikit_taxi_app
description: "A Flutter ride-hailing app with separate rider and driver experiences and OpenStreetMap tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.2
  flutter_map: ^8.2.2
  google_fonts: ^8.0.0
  http: ^1.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/taxi/
